[tool.poetry]
name = "bbui"
version = "0.1.0"
description = "Ansible inventory manager with CLI interface"
authors = ["You <you@example.com>"]
readme = "README.md"
packages = [{include = "bbui"}]

[tool.poetry.dependencies]
python = "^3.14"
typer = {extras = ["all"], version = "^0.15.0"}
pyyaml = "^6.0"
rich = "^13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.8.0"
mypy = "^1.13"

[tool.poetry.scripts]
bbcli = "bbui.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
