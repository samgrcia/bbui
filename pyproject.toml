[project]
name = "bbui"
version = "0.1.0"
description = "A TUI for BlueBanquise"
authors = [
    {name = "Samuel Garcia"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml (>=6.0.3,<7.0.0)", "clustershell (>=1.9.3,<2.0.0)", "typer (>=0.20.0,<0.21.0)", "configparser (>=7.2.0,<8.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
