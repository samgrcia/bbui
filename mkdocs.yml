site_name: bbui
site_description: Command-line Ansible inventory manager
site_url: https://samgrcia.github.io/bbui
repo_url: https://github.com/samgrcia/bbui
repo_name: samgrcia/bbui

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Inventory layouts: inventory-layouts.md
  - NodeSet syntax: nodeset.md
  - Staging workflow: staging.md
  - CLI reference: cli-reference.md
